version: 2

updates:
  - package-ecosystem: bundler
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    # Supply-chain delay: do not pick up a release in its first days.
    cooldown:
      default-days: 3
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
